<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#4a3360"/>
      <stop offset="0.55" stop-color="#241631"/>
      <stop offset="1" stop-color="#0d0712"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b6f24a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b6f24a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d979c"/>
      <stop offset="0.45" stop-color="#f4f7f8"/>
      <stop offset="1" stop-color="#9aa4a9"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a1c"/>
      <stop offset="0.45" stop-color="#c58a45"/>
      <stop offset="1" stop-color="#6a3c14"/>
    </linearGradient>
    <radialGradient id="bone" cx="45%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fbf6e6"/>
      <stop offset="0.6" stop-color="#e0d4b0"/>
      <stop offset="1" stop-color="#a99a72"/>
    </radialGradient>
    <linearGradient id="slime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ff8a"/>
      <stop offset="1" stop-color="#7fc21f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- plague glow behind the skull -->
  <circle cx="200" cy="200" r="170" fill="url(#aura)"/>

  <!-- fork: tines upper left -->
  <g transform="translate(200,200) rotate(-44) scale(1.12)" stroke="#1c1420" stroke-width="5" stroke-linejoin="round">
    <path fill="url(#silver)" d="M-7,-92 L-9,24 L9,24 L7,-92 Z"/>
    <path fill="url(#silver)" d="M-30,-172 L-30,-112 C-30,-97 -18,-88 0,-88 C18,-88 30,-97 30,-112 L30,-172 L21,-172 L21,-122 L13,-122 L13,-172 L4,-172 L4,-122 L-4,-122 L-4,-172 L-13,-172 L-13,-122 L-21,-122 L-21,-172 Z"/>
    <rect fill="url(#handle)" x="-12" y="20" width="24" height="150" rx="12"/>
  </g>

  <!-- knife: blade upper right -->
  <g transform="translate(200,200) rotate(44) scale(1.12)" stroke="#1c1420" stroke-width="5" stroke-linejoin="round">
    <path fill="url(#silver)" d="M-12,14 L-12,-150 C-12,-166 -6,-176 2,-176 C16,-166 22,-130 20,-70 L20,14 Z"/>
    <rect fill="url(#handle)" x="-13" y="12" width="26" height="158" rx="12"/>
  </g>

  <g transform="translate(200,206) scale(0.8) translate(-200,-196)">
  <!-- the skull -->
  <g stroke="#1c1420" stroke-width="5" stroke-linejoin="round">
    <!-- mouth shadow between the jaws -->
    <rect x="146" y="252" width="108" height="26" fill="#1c1420"/>
    <!-- jaw, dropped a little: mid-chew -->
    <path fill="url(#bone)" d="M140,276 L260,276 C262,300 244,322 200,324 C156,322 138,300 140,276 Z"/>
    <path fill="#f4ecd4" d="M152,276 L248,276 L248,290 L152,290 Z"/>
    <!-- cranium -->
    <path fill="url(#bone)" d="M200,62 C272,62 306,112 306,170 C306,206 290,228 270,240 L264,262 L136,262 L130,240 C110,228 94,206 94,170 C94,112 128,62 200,62 Z"/>
    <path fill="#f4ecd4" d="M146,248 L254,248 L254,264 L146,264 Z"/>
  </g>
  <!-- teeth -->
  <g stroke="#1c1420" stroke-width="3.5" stroke-linecap="round">
    <path d="M164,249 L164,263 M182,249 L182,263 M200,249 L200,263 M218,249 L218,263 M236,249 L236,263"/>
    <path d="M168,277 L168,289 M186,277 L186,289 M204,277 L204,289 M222,277 L222,289 M240,277 L240,289"/>
  </g>
  <!-- a missing tooth, as is tradition -->
  <rect x="219.5" y="250" width="15" height="12" fill="#1c1420"/>

  <!-- eye sockets and nose -->
  <g fill="#1c1420">
    <path d="M128,176 C128,152 146,142 166,146 C186,150 194,166 190,184 C186,204 166,212 150,206 C136,200 128,190 128,176 Z"/>
    <path d="M272,176 C272,152 254,142 234,146 C214,150 206,166 210,184 C214,204 234,212 250,206 C264,200 272,190 272,176 Z"/>
    <path d="M200,212 L186,236 C190,242 196,240 200,234 C204,240 210,242 214,236 Z"/>
  </g>
  <!-- a crack, Forsaken style -->
  <path d="M232,66 L224,92 L238,106 L226,130" fill="none" stroke="#1c1420" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- cheek shading -->
  <g fill="#a99a72" opacity="0.5">
    <ellipse cx="128" cy="222" rx="12" ry="16"/>
    <ellipse cx="272" cy="222" rx="12" ry="16"/>
  </g>

  <!-- hungry glowing eyes -->
  <g fill="#c4ff5a" filter="url(#glow)">
    <circle cx="163" cy="178" r="10"/>
    <circle cx="237" cy="178" r="10"/>
  </g>

  <!-- drool: it's delicious -->
  <g filter="url(#glow)">
    <path fill="url(#slime)" stroke="#2e4a0c" stroke-width="3" stroke-linejoin="round"
      d="M244,290 C246,304 240,318 244,334 C248,348 264,348 266,334 C268,318 258,304 256,290 Z"/>
  </g>
  <ellipse cx="251" cy="326" rx="3" ry="5" fill="#f4ffd0" opacity="0.8"/>

  </g>

  <!-- embers -->
  <g fill="#c4ff5a" filter="url(#glow)">
    <circle cx="62" cy="80" r="3.5"/><circle cx="346" cy="92" r="3"/><circle cx="48" cy="250" r="3"/>
    <circle cx="356" cy="268" r="4"/><circle cx="110" cy="360" r="3"/><circle cx="300" cy="364" r="2.5"/>
  </g>
</svg>
