<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2f5a35"/>
      <stop offset="0.6" stop-color="#15301c"/>
      <stop offset="1" stop-color="#07130b"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b6f24a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b6f24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b6f24a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#b6f24a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d979c"/>
      <stop offset="0.45" stop-color="#f4f7f8"/>
      <stop offset="1" stop-color="#9aa4a9"/>
    </linearGradient>
    <radialGradient id="china" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fbf7ea"/>
      <stop offset="1" stop-color="#cfc6ab"/>
    </radialGradient>
    <radialGradient id="meat" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e48a5c"/>
      <stop offset="0.55" stop-color="#b2502c"/>
      <stop offset="1" stop-color="#6e2a14"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d8cdb0"/>
    </linearGradient>
    <mask id="bite">
      <rect x="-100" y="-100" width="200" height="200" fill="#fff"/>
      <circle cx="-42" cy="-33" r="11" fill="#000"/>
      <circle cx="-24" cy="-35" r="11" fill="#000"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="44" cy="40" r="2"/><circle cx="150" cy="30" r="1.4"/><circle cx="30" cy="170" r="1.6"/>
    <circle cx="372" cy="150" r="2"/><circle cx="64" cy="300" r="1.4"/><circle cx="380" cy="290" r="1.4"/>
  </g>

  <!-- plague aura around the diner -->
  <circle cx="200" cy="250" r="150" fill="url(#aura)"/>
  <ellipse cx="200" cy="356" rx="150" ry="26" fill="url(#pool)"/>

  <!-- fork (left) and knife (right), held upright -->
  <g stroke="#2a2f33" stroke-width="4" stroke-linejoin="round" fill="url(#silver)">
    <path d="M124,146 L124,262 L136,262 L136,146 Z"/>
    <path d="M110,92 L110,134 C110,146 118,152 130,152 C142,152 150,146 150,134 L150,92 L142,92 L142,128 L136,128 L136,92 L124,92 L124,128 L118,128 L118,92 Z"/>
    <path d="M264,150 L264,262 L276,262 L276,192 C291,183 295,164 288,136 C282,126 270,130 264,150 Z"/>
  </g>

  <!-- the diner: arms raised, utensils in hand -->
  <g stroke-linecap="round">
    <g stroke="#3a2306" stroke-width="24">
      <path d="M170,280 L132,246"/>
      <path d="M230,280 L268,246"/>
    </g>
    <g stroke="url(#gold)" stroke-width="16">
      <path d="M170,280 L132,246"/>
      <path d="M230,280 L268,246"/>
    </g>
  </g>
  <g stroke="#3a2306" stroke-width="4" fill="url(#gold)">
    <circle cx="130" cy="244" r="13"/>
    <circle cx="270" cy="244" r="13"/>
  </g>
  <g transform="translate(200,306) scale(1.7)" stroke="#3a2306" stroke-width="2.4" stroke-linejoin="round" fill="url(#gold)">
    <path d="M-28,0 C-28,-30 -18,-44 0,-44 C18,-44 28,-30 28,0 Z"/>
    <circle cx="0" cy="-62" r="15"/>
  </g>
  <!-- undead eyes -->
  <g fill="#c4ff5a" filter="url(#glow)">
    <ellipse cx="191" cy="199" rx="4.5" ry="3.5"/><ellipse cx="209" cy="199" rx="4.5" ry="3.5"/>
  </g>
  <!-- napkin tucked in -->
  <path d="M184,236 L216,236 L200,262 Z" fill="#fbf7ea" stroke="#3a2306" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- the plate -->
  <ellipse cx="200" cy="322" rx="132" ry="40" fill="url(#gold)" stroke="#3a2306" stroke-width="4"/>
  <ellipse cx="200" cy="320" rx="112" ry="30" fill="url(#china)" stroke="#8f5f17" stroke-width="2.5"/>

  <!-- the meal: a drumstick with a bite out of it -->
  <g transform="translate(192,304) rotate(-12)">
    <g stroke="#3a1d0e" stroke-width="3.5" stroke-linejoin="round" fill="url(#bone)">
      <rect x="18" y="-7" width="46" height="14" rx="4"/>
      <circle cx="68" cy="-9" r="10"/>
      <circle cx="68" cy="9" r="10"/>
    </g>
    <path d="M60,-5 L60,5" stroke="url(#bone)" stroke-width="10"/>
    <path mask="url(#bite)" d="M-74,0 C-74,-32 -42,-40 -10,-31 C10,-26 22,-14 28,-6 L28,6 C22,14 10,25 -10,31 C-42,40 -74,32 -74,0 Z"
      fill="url(#meat)" stroke="#3a1d0e" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="none" stroke="#3a1d0e" stroke-width="3.5" stroke-linecap="round">
      <path d="M-53,-31 A11,11 0 0,0 -33,-28"/>
      <path d="M-33,-28 A11,11 0 0,0 -14,-31"/>
    </g>
    <ellipse cx="-44" cy="-6" rx="14" ry="6" fill="#f3b48a" opacity="0.55"/>
  </g>

  <!-- the review: a speech bubble with three gold stars -->
  <g stroke="#3a2306" stroke-width="4" stroke-linejoin="round">
    <path d="M286,40 L352,40 C366,40 376,50 376,64 L376,82 C376,96 366,106 352,106 L300,106 L250,140 L272,106 L286,106 C272,106 262,96 262,82 L262,64 C262,50 272,40 286,40 Z"
      fill="#fbf7ea"/>
  </g>
  <g fill="url(#gold)" stroke="#3a2306" stroke-width="2.5" stroke-linejoin="round">
    <path transform="translate(290,74)" d="M0,-14 L3.5,-4.8 L13.3,-4.3 L5.6,1.8 L8.2,11.3 L0,5.9 L-8.2,11.3 L-5.6,1.8 L-13.3,-4.3 L-3.5,-4.8 Z"/>
    <path transform="translate(319,74)" d="M0,-14 L3.5,-4.8 L13.3,-4.3 L5.6,1.8 L8.2,11.3 L0,5.9 L-8.2,11.3 L-5.6,1.8 L-13.3,-4.3 L-3.5,-4.8 Z"/>
    <path transform="translate(348,74)" d="M0,-14 L3.5,-4.8 L13.3,-4.3 L5.6,1.8 L8.2,11.3 L0,5.9 L-8.2,11.3 L-5.6,1.8 L-13.3,-4.3 L-3.5,-4.8 Z"/>
  </g>

  <!-- plague embers and sparkles -->
  <g fill="#c4ff5a" filter="url(#glow)">
    <circle cx="70" cy="214" r="4"/><circle cx="336" cy="196" r="3.5"/><circle cx="52" cy="330" r="3"/>
    <circle cx="350" cy="332" r="4"/><circle cx="92" cy="60" r="2.5"/>
  </g>
  <g fill="#fff6d0">
    <path d="M200,52 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M56,120 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
  </g>
</svg>
